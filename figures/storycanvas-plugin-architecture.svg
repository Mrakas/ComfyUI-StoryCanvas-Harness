<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">StoryCanvas: a small harness for composable video-generation methods</title>
<desc id="figure-description">StoryCanvas architecture and Plugin API. Community methods become Skills or executable Plugins, are distributed in Packs, selected by Profiles, resolved by a capability registry, executed by the minimal kernel, and projected into host-neutral inspectable Runs.</desc>
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.10"/></filter>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 9 4.5 L 0 9 z" fill="#64748B"/></marker>
</defs>
<rect width="1600" height="900" fill="#FBFCFE"/>
<text x="60" y="55" text-anchor="start" font-family="Inter, Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#0F172A">StoryCanvas: a small harness for composable video-generation methods</text>
<text x="60" y="96" text-anchor="start" font-family="Inter, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#475569">Community work plugs in through typed capabilities; the kernel keeps planning, media, and provenance inspectable.</text>
<rect x="40" y="140" width="330" height="590" rx="22" fill="#FFF9F7" stroke="#FED7D2" stroke-width="1.5"/>
<text x="64" y="174" text-anchor="start" font-family="Inter, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#334155">A. Bring a community method</text>
<rect x="400" y="140" width="800" height="590" rx="22" fill="#F7F8FF" stroke="#C7D2FE" stroke-width="1.5"/>
<text x="424" y="174" text-anchor="start" font-family="Inter, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#334155">B. Compose once in the StoryCanvas Harness</text>
<rect x="1230" y="140" width="330" height="590" rx="22" fill="#F4FBF8" stroke="#A7F3D0" stroke-width="1.5"/>
<text x="1254" y="174" text-anchor="start" font-family="Inter, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#334155">C. Run anywhere, inspect everything</text>
<rect x="40" y="760" width="1520" height="105" rx="22" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="64" y="794" text-anchor="start" font-family="Inter, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#334155">Add a method without forking the core</text>
