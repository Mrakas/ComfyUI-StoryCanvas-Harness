<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">From bespoke video pipelines to an inspectable story harness</title>
<desc id="figure-description">Figure 1. StoryCanvas replaces repeated, opaque, or hand-wired video-generation pipelines with one composable harness that produces an editable media DAG, consistent multi-shot video, and reproducible evaluation.</desc>
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.10"/></filter>
