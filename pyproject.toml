[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "storycanvas-harness"
version = "0.1.0"
description = "Agent-planned, auditable multi-reference Story Canvas workflows for ComfyUI"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "StoryCanvas Harness contributors"}]
keywords = ["comfyui", "video-generation", "agent", "storyboard", "canvas"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "pydantic>=2.8,<3",
  "httpx>=0.27,<1",
  "openai>=1.68,<4",
  "Pillow>=10.4,<13",
  "jinja2>=3.1,<4",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "typer>=0.12,<1",
  "tomli>=2,<3",
]

[project.optional-dependencies]
codex = [
  "openai-codex==0.147.0",
]
dev = [
  "bandit>=1.9,<2",
  "build>=1.2,<2",
  "mypy>=1.11,<2",
  "pip-audit>=2.10,<3",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.2,<2",
  "pytest-cov>=5,<7",
  "ruff>=0.7,<1",
]
demo = [
  "playwright>=1.55,<2",
]

[project.scripts]
storycanvas = "storycanvas_harness.cli:app"

[project.urls]
Homepage = "https://github.com/Mrakas/ComfyUI-StoryCanvas-Harness"
Repository = "https://github.com/Mrakas/ComfyUI-StoryCanvas-Harness"
Issues = "https://github.com/Mrakas/ComfyUI-StoryCanvas-Harness/issues"

[tool.setuptools.packages.find]
include = ["storycanvas_harness*"]

[tool.setuptools.package-data]
storycanvas_harness = ["templates/*.html"]

[tool.comfy]
PublisherId = "mrakas"
DisplayName = "StoryCanvas Harness"
Icon = ""

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated.*",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["storycanvas_harness.comfy_api"]
ignore_errors = true

[tool.coverage.run]
source = ["storycanvas_harness"]
omit = ["storycanvas_harness/comfy_nodes.py"]
