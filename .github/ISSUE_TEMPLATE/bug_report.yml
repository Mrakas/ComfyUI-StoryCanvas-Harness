name: Bug report
description: Report a reproducible StoryCanvas problem using fictional/sanitized data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never paste API keys, private benchmark data, or internal infrastructure details.
  - type: input
    id: version
    attributes:
      label: StoryCanvas version or commit
    validations:
      required: true
  - type: input
    id: comfy
    attributes:
      label: ComfyUI backend/frontend versions
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use the smallest fictional input possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized receipts
    validations:
      required: true
