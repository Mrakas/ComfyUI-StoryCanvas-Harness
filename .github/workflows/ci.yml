name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install package
        run: |
          python -m pip install --upgrade pip "setuptools>=83" wheel
          python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff format --check . && ruff check .
      - name: Mypy
        if: matrix.python-version == '3.12'
        run: mypy -p storycanvas_harness
      - name: Tests
        run: pytest
      - name: Verify examples
        run: python scripts/verify_examples.py
      - name: Run Plugin Profile demos
        run: python scripts/run_plugin_demos.py
      - name: Verify deterministic Figure 1
        run: python scripts/render_figure1.py --check
      - name: Static security scan
        run: bandit -q -r storycanvas_harness scripts
      - name: Dependency audit
        run: pip-audit
      - name: Build distributions
        if: matrix.python-version == '3.12'
        run: python -m build
